# Canonical Dependabot config for the WYRE-AI *-mcp / node-* fleet.
#
# Goal: keep PR volume manageable for a small team. Updates are GROUPED so a
# repo gets a handful of PRs per week instead of one-per-package, and the
# dependabot-janitor (daily) auto-merges the green grouped PRs. Only
# PRODUCTION-dependency MAJOR bumps land as individual PRs for human review,
# since those can carry behavioural breaking changes a green test suite misses.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      # All dev/CI tooling (eslint, vitest, typescript, @types/*, etc.) incl.
      # majors → ONE PR. The janitor auto-merges it when CI is green.
      dev-dependencies:
        dependency-type: "development"
        update-types: ["major", "minor", "patch"]
      # Production minor + patch → ONE PR. Auto-merged when green.
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    # Production MAJORS are intentionally NOT grouped → individual PRs, held for
    # human review (never auto-merged).
    ignore:
      # typescript 7.x breaks this fleet's toolchain: DTS emit (tsup/rollup-plugin-dts
      # TS5101 baseUrl-deprecated-as-error), and typescript-eslint (still <6.1.0 as of
      # 8.66.0, no TS7 support yet). Has broken main 3x on some repos because Dependabot
      # has no memory of a prior manual revert and just re-proposes the same major again.
      # Deliberate hold, not a permanent blind -- remove once typescript-eslint + the
      # tsup/DTS toolchain support TS7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # undici (GHSA, security-update job) is unreachable: the only copy Dependabot
      # can resolve to is node_modules/npm/node_modules/undici@6.27.0, nested inside
      # npm's own bundled dependency tree -- same shape as this fleet's node-halopsa
      # (wyre-technology/node-halopsa#67) and the 7-repo batch fixed 2026-08-25
      # (WYRE-AI/node-ninjaone#74 etc). The reachable top-level undici (^7.0.0) is
      # already on a patched version; this ignore only stops Dependabot repeatedly
      # failing on the unreachable nested copy. Revisit once npm bundles a patched
      # undici.
      - dependency-name: "undici"
      # esbuild (GHSA, security-update job) is genuinely peer-capped, not
      # nested-unreachable: tsup@8.5.1 requires esbuild@^0.27.0, so 0.27.7 is the
      # highest version npm's resolver can install (confirmed via the job's own
      # conflicting-dependencies report, fix_available:false). Not fixable here
      # without a tsup major bump. Revisit once tsup relaxes/bumps its esbuild peer
      # range.
      - dependency-name: "esbuild"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]

